# Reference compose file for a project that works with LanProjectsControlPanel.
# The only change from a normal project: every published port is on ${BIND:-127.0.0.1}. ./dev sets BIND from
# --bind; without it the ports are on 127.0.0.1 as usual, so standalone use is unchanged. The port numbers
# never change: lpcp gives each project its own address, so two projects can both publish 80 and 5432.
services:
  web:
    image: caddy:2.11.9
    command: caddy respond --listen :80 "Hello from ${PROJECT_NAME:-example} (${LPCP_URL:-standalone})"
    ports:
      - "${BIND:-127.0.0.1}:80:80"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:80/"]
      interval: 2s
      retries: 15

  db:
    image: postgres:18.4-alpine
    environment:
      POSTGRES_PASSWORD: example   # development only
    ports:
      - "${BIND:-127.0.0.1}:5432:5432"
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 2s
      retries: 15
